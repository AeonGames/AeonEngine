syntax = "proto3";
package AeonGames;

import "transform.proto";
import "reference.proto";
import "vector4.proto";
import "property.proto";

message ComponentMsg {
    string type = 1;
    repeated PropertyMsg property = 2;
}

message NodeMsg {
    optional string id = 1;
    oneof transform {
        TransformMsg local = 2;
        TransformMsg global = 3;
    }
    repeated ComponentMsg component = 4;
    repeated NodeMsg node = 5;
}

message CameraMsg {
    string              node          = 1;
    float               field_of_view = 2;
    float               near_plane    = 3;
    float               far_plane     = 4;
}

message SceneMsg{
    string              name              = 1;
    CameraMsg           camera            = 2;
    optional ReferenceMsg lighting_pipeline = 3;
    repeated NodeMsg    node              = 4;
    optional Vector4Msg ambient           = 5;
    optional ReferenceMsg environment_map = 6;
}
