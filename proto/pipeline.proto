syntax = "proto3";
package AeonGames;

message PipelineMsg {
	enum Toggle
	{
		DISABLED = 0;
		ENABLED  = 1;
	};
	enum CullMode
	{
		CULL_BACK  = 0;
		CULL_FRONT = 1;
		CULL_NONE  = 2;
	};
	enum FrontFace
	{
		FRONT_COUNTER_CLOCKWISE = 0;
		FRONT_CLOCKWISE         = 1;
	};
	enum PolygonMode
	{
		POLYGON_FILL  = 0;
		POLYGON_LINE  = 1;
		POLYGON_POINT = 2;
	};
	enum CompareOp
	{
		COMPARE_LESS_OR_EQUAL = 0;
		COMPARE_NEVER         = 1;
		COMPARE_LESS          = 2;
		COMPARE_EQUAL         = 3;
		COMPARE_GREATER       = 4;
		COMPARE_NOT_EQUAL     = 5;
		COMPARE_GREATER_OR_EQUAL = 6;
		COMPARE_ALWAYS        = 7;
	};
	enum BlendFactor
	{
		BLEND_ONE                    = 0;
		BLEND_ZERO                   = 1;
		BLEND_SOURCE_ALPHA           = 2;
		BLEND_ONE_MINUS_SOURCE_ALPHA = 3;
		BLEND_DESTINATION_ALPHA      = 4;
		BLEND_ONE_MINUS_DESTINATION_ALPHA = 5;
		BLEND_DESTINATION_COLOR      = 6;
		BLEND_ONE_MINUS_DESTINATION_COLOR = 7;
	};
	enum BlendOp
	{
		BLEND_ADD              = 0;
		BLEND_SUBTRACT         = 1;
		BLEND_REVERSE_SUBTRACT = 2;
		BLEND_MIN              = 3;
		BLEND_MAX              = 4;
	};
	enum StencilOp
	{
		STENCIL_KEEP                 = 0;
		STENCIL_ZERO                 = 1;
		STENCIL_REPLACE              = 2;
		STENCIL_INCREMENT_AND_CLAMP  = 3;
		STENCIL_DECREMENT_AND_CLAMP  = 4;
		STENCIL_INVERT               = 5;
		STENCIL_INCREMENT_AND_WRAP   = 6;
		STENCIL_DECREMENT_AND_WRAP   = 7;
	};
	enum SampleCount
	{
		SAMPLE_COUNT_1  = 0;
		SAMPLE_COUNT_2  = 1;
		SAMPLE_COUNT_4  = 2;
		SAMPLE_COUNT_8  = 3;
		SAMPLE_COUNT_16 = 4;
		SAMPLE_COUNT_32 = 5;
		SAMPLE_COUNT_64 = 6;
	};
	message RasterState
	{
		CullMode   cull_mode           = 1;
		FrontFace  front_face          = 2;
		PolygonMode polygon_mode       = 3;
		Toggle     depth_clamp         = 4;
		Toggle     rasterizer_discard  = 5;
		Toggle     depth_bias          = 6;
		float      depth_bias_constant = 7;
		float      depth_bias_clamp    = 8;
		float      depth_bias_slope    = 9;
		float      line_width          = 10;
	};
	message DepthStencilState
	{
		Toggle    depth_test               = 1;
		Toggle    depth_write              = 2;
		CompareOp depth_compare            = 3;
		Toggle    depth_bounds_test        = 4;
		float     min_depth_bounds         = 5;
		float     max_depth_bounds         = 6;
		Toggle    stencil_test             = 7;
		CompareOp stencil_compare          = 8;
		StencilOp stencil_front_fail       = 9;
		StencilOp stencil_front_depth_fail = 10;
		StencilOp stencil_front_pass       = 11;
		StencilOp stencil_back_fail        = 12;
		StencilOp stencil_back_depth_fail  = 13;
		StencilOp stencil_back_pass        = 14;
		uint32    stencil_reference        = 15;
		uint32    stencil_compare_mask     = 16;
		uint32    stencil_write_mask       = 17;
	};
	message BlendState
	{
		Toggle      enabled           = 1;
		uint32      color_write_mask  = 2;
		BlendFactor source_color      = 3;
		BlendFactor destination_color = 4;
		BlendOp     color_operation   = 5;
		BlendFactor source_alpha      = 6;
		BlendFactor destination_alpha = 7;
		BlendOp     alpha_operation   = 8;
	};
	message MultisampleState
	{
		SampleCount sample_count       = 1;
		Toggle      sample_shading     = 2;
		float       min_sample_shading = 3;
		Toggle      alpha_to_coverage  = 4;
		Toggle      alpha_to_one       = 5;
	};

    enum TopologyClass
    {
		DEFAULT                 = 0;
		POINT                   = 1;
		LINE                    = 2;
		POINT_AND_LINE          = 3;
		TRIANGLE                = 4;
		POINT_AND_TRIANGLE      = 5;
		LINE_AND_TRIANGLE       = 6;
		POINT_LINE_AND_TRIANGLE = 7;
		PATCH                   = 8;
		POINT_AND_PATCH         = 9;
		LINE_AND_PATCH          = 10;
		POINT_LINE_AND_PATCH    = 11;
		TRIANGLE_AND_PATCH      = 12;
		POINT_TRIANGLE_AND_PATCH= 13;
		LINE_TRIANGLE_AND_PATCH = 14;
		ALL                     = 15;
	};
	// Ordered list of compute shader stage sources (stage 0 dispatched first).
	message ComputeStages {
		repeated string stage = 1;
	}
	// Backend-neutral interface metadata generated from a compiled shader. A
	// renderer consumes this instead of parsing source text to discover entry
	// points, workgroup dimensions and named resource bindings.
	message ShaderResource {
		enum Type {
			RESOURCE_UNKNOWN = 0;
			UNIFORM_BUFFER = 1;
			STORAGE_BUFFER = 2;
			SAMPLED_IMAGE = 3;
			STORAGE_IMAGE = 4;
			SAMPLER = 5;
			COMBINED_IMAGE_SAMPLER = 6;
		}
		string name = 1;
		uint32 set = 2;
		uint32 binding = 3;
		uint32 count = 4;
		Type type = 5;
	}
	message ShaderInterface {
		enum Stage {
			STAGE_VERTEX = 0;
			STAGE_FRAGMENT = 1;
			STAGE_COMPUTE = 2;
			STAGE_TESS_CONTROL = 3;
			STAGE_TESS_EVALUATION = 4;
			STAGE_GEOMETRY = 5;
		}
		Stage stage = 1;
		uint32 compute_stage_index = 2;
		string entry_point = 3;
		uint32 local_size_x = 4;
		uint32 local_size_y = 5;
		uint32 local_size_z = 6;
		uint32 fragment_output_count = 7;
		repeated ShaderResource resource = 8;
		message Input {
			enum ScalarType {
				SCALAR_UNKNOWN = 0;
				SCALAR_FLOAT = 1;
				SCALAR_INT = 2;
				SCALAR_UINT = 3;
			}
			string name = 1;
			uint32 location = 2;
			uint32 components = 3;
			ScalarType scalar_type = 4;
		}
		repeated Input input = 9;
	}
	message ShaderInterfaces {
		repeated ShaderInterface stage = 1;
	}
	// Each stage maps a renderer selector to its shader source. The selector key
	// is a comma-separated set of renderer names matching the names the renderer
	// plugins export (e.g. "Vulkan", "OpenGL,Metal"); the empty key "" is the
	// default used by any renderer not named in another key. The value is the
	// shader source, or an empty string to explicitly disable the stage for the
	// selected renderers (so a renderer-specific empty entry opts out of the
	// default instead of inheriting it). The pipeline tool guarantees the
	// non-empty keys of a stage are pairwise disjoint, so at most one matches any
	// given renderer.
	map<string, string>        vert           = 1;
	map<string, string>        frag           = 2;
	map<string, ComputeStages> comp           = 3;
	map<string, string>        tesc           = 4;
	map<string, string>        tese           = 5;
	map<string, string>        geom           = 6;
	optional TopologyClass     topology_class = 7;
	RasterState                raster_state   = 8;
	DepthStencilState          depth_stencil  = 9;
	BlendState                 blend          = 10;
	MultisampleState           multisample    = 11;
	// Renderer selector -> interfaces for the effective shader stages. Selector
	// resolution follows the same comma-separated convention as shader source.
	map<string, ShaderInterfaces> shader_interface = 12;
}
